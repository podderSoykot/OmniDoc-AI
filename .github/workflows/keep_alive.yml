name: Keep Alive Render Backend

on:
  schedule:
    # Run every 10 minutes to prevent Render free-tier from sleeping
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Ping OmniDoc Backend Health Endpoint
        run: |
          echo "Pinging OmniDoc Backend to keep it warm..."
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 "https://omnidoc-ai-backend-9oin.onrender.com/health")
          echo "Response HTTP Status: $HTTP_STATUS"
          if [ "$HTTP_STATUS" -eq 200 ]; then
            echo "✅ OmniDoc Backend is alive and warm!"
          else
            echo "⚠️ Non-200 status received ($HTTP_STATUS), ping completed."
          fi
