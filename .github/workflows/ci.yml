name: OmniDoc-AI CI Pipeline

on:
  push:
    branches: [ "main", "master", "dev*", "feat*" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  backend-tests:
    name: Backend Test Suite & Coverage
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install system dependencies (OCR & PDF Libraries)
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr libtesseract-dev libgl1

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r Backend/requirements.txt

      - name: Run Pytest with Coverage
        env:
          JWT_SECRET: ci-test-secret-key-32-bytes-minimum-length
          DATABASE_URL: sqlite:///:memory:
        run: |
          cd Backend
          pytest -q --cov=app --cov-report=term-missing

  frontend-build:
    name: Frontend Build & Typecheck
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: Frontend/package-lock.json

      - name: Install Frontend dependencies
        run: |
          cd Frontend
          npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      - name: Run Frontend Tests
        run: |
          cd Frontend
          npm test

      - name: Build Next.js Production Bundle
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
        run: |
          cd Frontend
          npm run build
